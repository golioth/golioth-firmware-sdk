sample:
  description: Golioth OTA FW Update Sample
  name: fw_update
common:
  tags:
    - golioth
    - socket
    - goliothd
tests:
  sample.golioth.fw_update:
    harness: pytest
    sysbuild: true
    timeout: 720
    extra_configs:
      - CONFIG_GOLIOTH_SAMPLE_TWISTER_TEST=y
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
      - frdm_rw612
      - nrf9160dk/nrf9160/ns
      - nucleo_h563zi/stm32h563xx
  sample.golioth.fw_update.native:
    build_only: true
    platform_allow:
      - native_sim
      - native_sim/native/64
  sample.golioth.fw_update.wifi:
    harness: pytest
    sysbuild: true
    tags:
      - golioth
      - socket
      - goliothd
    timeout: 720
    extra_configs:
      - CONFIG_GOLIOTH_SAMPLE_TWISTER_TEST=y
      - CONFIG_GOLIOTH_FW_UPDATE_PACKAGE_NAME="frdm_rw612_wifi"
    extra_args:
      - EXTRA_CONF_FILE=boards/frdm_rw612_wifi.conf
    platform_allow:
      - frdm_rw612
